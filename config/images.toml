# Code overlays inside ST\COM\FDAT.T. The archive is a u16 entry count
# followed by u16 sector (0x800-byte) offsets; entry i spans sectors
# offset[i]..offset[i+1]. 36 entries hold MIPS code, all at indices 2, 12,
# 22, ..., 472 (every tenth index that is non-empty); the other entries are
# data. Each overlay is loaded whole at 0x801EB560, the end of ST.EXE's .bss
# (ST's startup code clears 0x80088188..0x801EB560), so it shares ST.EXE's
# address space and calls straight into ST.EXE's text. `load_size` is the
# sector-granular entry span. Every overlay starts with a u32 id word and 32
# absolute handler pointers (0x84 bytes); each pointer lands inside its own
# overlay on a function boundary. Entries 2, 322 and 402 are byte-identical
# (id 0x37). Overlays are named by archive entry index, not by map, because
# the map-to-entry relation is not yet proven.
[[archive]]
name = "FDAT.T"
disc_path = "ST/COM/FDAT.T"
sha256 = "746685a8454c7f6ea34cf3cfbefe198104633f65ea5664d1132ec4bc3f545a06"
file_size = 0x1695800

