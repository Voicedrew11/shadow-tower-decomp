# MANUALLY MANAGED - the retail disc and the linked images it carries.
#
# `name` is the tool's image identity (`--image` takes its lowercase stem,
# e.g. `st` or `fdat_012`). Root programs are PS-X EXEs read from the root
# ISO9660 file `disc_file`; `kf init` checks their header fields, so a wrong
# dump fails before any query. Overlays are headerless code images read from
# an archive entry (see the end of this file). Images are listed in disc
# (LBA) order, then the overlays by archive entry; reports and inventories
# sort them in this order.
#
# Who loads what. PSX.EXE is a program sequencer: its table at 0x80010350
# names, by index, 0 STR.EXE, 1 TITLE.EXE, 2 OPTXT.EXE, 3 ST.EXE, 4 END.EXE,
# 5 VS.EXE. It starts with index 0, then loops: BIOS Load(table[index]),
# Exec, and on return reads the next index from the byte at 0x800103F0.
# Each program carries its own copy of the six-path table. STR.EXE stores 1
# (TITLE.EXE). TITLE.EXE stores 2 (OPTXT.EXE) for a new game, 3 (ST.EXE) for
# Continue with 2 in the mailbox byte 0x800103F1, 5 (VS.EXE) for versus, and
# 0 (STR.EXE) when the title times out. OPTXT.EXE stores 3 (ST.EXE), ST.EXE
# 4 (END.EXE), and END.EXE and VS.EXE 1 (TITLE.EXE). ST.EXE alone names
# `COM\FDAT.T` and loads the FDAT overlays.

[disc]
serial = "SLUS-00863"
title = "Shadow Tower (USA)"
# Single-track MODE2/2352 image.
sha256 = "420420cee70eec9d6b4c81dcf6e16494f72fc3976a93fcbe4076a7336c659adb"

# `gp` is the $gp value each program's startup loads (lui/addiu gp before the
# jump to main); gp-relative relocations decode against it. Overlays use
# their host's.

# Boot loader named by SYSTEM.CNF (`BOOT = cdrom:\SLUS_008.63;1`). The disc
# also carries a byte-identical copy as PSX.EXE.
[[image]]
name = "PSX.EXE"
disc_file = "SLUS_008.63"
sha256 = "dd01da6ae1c9de87ae0f818b60da2cd59d13031c039e2c0013c3657f8654821e"
file_size = 0x1000
entry = 0x800101C0
gp = 0x80010394
load_address = 0x80010000
load_size = 0x800

# Every program below except TITLE.EXE loads at 0x80011000.
