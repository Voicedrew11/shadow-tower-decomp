# MANUALLY MANAGED - the retail disc and the linked programs it carries.
#
# `name` is the tool's image identity (`--image` takes its lowercase stem);
# `disc_file` is the root ISO9660 file it is read from. The PS-X EXE header
# fields are checked by `kf init`, so a wrong dump fails before any query.
# Images are listed in disc (LBA) order, the order reports and inventories
# sort them. Which program loads which overlay is not yet established.

[disc]
serial = "SLUS-00863"
title = "Shadow Tower (USA)"
# Single-track MODE2/2352 image.
sha256 = "420420cee70eec9d6b4c81dcf6e16494f72fc3976a93fcbe4076a7336c659adb"

# Boot loader named by SYSTEM.CNF (`BOOT = cdrom:\SLUS_008.63;1`). The disc
# also carries a byte-identical copy as PSX.EXE.
[[image]]
name = "PSX.EXE"
disc_file = "SLUS_008.63"
sha256 = "dd01da6ae1c9de87ae0f818b60da2cd59d13031c039e2c0013c3657f8654821e"
file_size = 0x1000
entry = 0x800101C0
load_address = 0x80010000
load_size = 0x800

# Every program below except TITLE.EXE loads at 0x80011000.
[[image]]
name = "STR.EXE"
disc_file = "STR.EXE"
sha256 = "391c6184b5a68d21db908be029acf050f766e90bcb1eafbcef1c1c1676d47765"
