# Explicit reconstruction build units. A profile names the compiler, its
# optimization and small-data threshold, and the assembler; see
# docs/toolchain.md for what each setting is proven by.

# Default. The SN Systems GCC 2.7.2 (cygnus-2.7.2-970404 SN32) rebuild at -O2
# -G0 reproduces sampled ST.EXE game functions exactly with ASPSX 2.79; the
# original Win32 CC1PSX.EXE and its driver flags remain unrecovered.
[profiles.probe-gcc272cdk-o2-g0]
language = "c"
compiler = "gcc272cdk-native"
optimization = "O2"
small_data = 0
aspsx_version = "2.79"
cc1_flags = []

# PSX.EXE's main reads its words $gp-relative: its .sdata needs -G4 or more.
# -G8 (the GCC MIPS default) and -G4 give identical bytes for that unit.
[profiles.probe-gcc272cdk-o2-g8]
language = "c"
compiler = "gcc272cdk-native"
optimization = "O2"
small_data = 8
aspsx_version = "2.79"
cc1_flags = []

# Add one [[unit]] per reconstructed source, in linked (ascending address) order per image.

